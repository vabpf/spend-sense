name: Run Unit Tests

on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx12288m -XX:+UseG1GC -Dfile.encoding=UTF-8\" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4"
  JAVA_OPTS: "-Xmx12288m"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Tests & Benchmarks (spend_sense_core)
        run: cargo test --manifest-path rust/spend_sense_core/Cargo.toml -- --nocapture

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Run Finished!" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **All unit tests passed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some unit tests failed.** Inspect logs for details." >> $GITHUB_STEP_SUMMARY
          fi
