name: Test & Build Release APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select execution target'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'test'
          - 'build'
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Custom Release Tag (leave blank for auto v<versionName>.<run_number>)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx12288m -XX:+UseG1GC -Dfile.encoding=UTF-8\" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4"
  JAVA_OPTS: "-Xmx12288m"

jobs:
  run-pipeline:
    name: ${{ inputs.target == 'test' && 'Run Tests' || (inputs.target == 'build' && 'Build Release APK' || 'Test & Build Release APK') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Run Unit Tests
        if: ${{ inputs.target == 'all' || inputs.target == 'test' }}
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        if: ${{ inputs.target == 'all' || inputs.target == 'build' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact & Metadata
        if: ${{ inputs.target == 'all' || inputs.target == 'build' }}
        id: apk_meta
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/SpendSense.apk
          
          APK_SIZE=$(du -h artifacts/SpendSense.apk | cut -f1)
          APK_SHA=$(sha256sum artifacts/SpendSense.apk | cut -d ' ' -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "apk_sha=$APK_SHA" >> $GITHUB_OUTPUT

      - name: Upload Release APK Artifact
        if: ${{ inputs.target == 'all' || inputs.target == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: SpendSense-Release-APK
          path: artifacts/SpendSense.apk
          retention-days: 30

      - name: Determine Release Tag & Metadata
        if: ${{ (inputs.target == 'all' || inputs.target == 'build') && (inputs.publish_release == true || startsWith(github.ref, 'refs/tags/v')) && success() }}
        id: release_meta
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0")
          TAG_INPUT="${{ inputs.tag_name }}"
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION_NAME}.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=SpendSense $TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: ${{ (inputs.target == 'all' || inputs.target == 'build') && (inputs.publish_release == true || startsWith(github.ref, 'refs/tags/v')) && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          files: artifacts/SpendSense.apk
          generate_release_notes: true
          make_latest: true

      - name: Generate Job Summary with Download Link
        if: ${{ (inputs.target == 'all' || inputs.target == 'build') && success() }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ARTIFACT_URL="${RUN_URL}#artifacts"
          
          echo "## 🚀 SpendSense Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 APK Artifact Details" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package Name** | \`SpendSense.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **File Size** | \`${{ steps.apk_meta.outputs.apk_size }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA256** | \`${{ steps.apk_meta.outputs.apk_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact Download** | [📥 Download SpendSense-Release-APK](${ARTIFACT_URL}) |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.publish_release }}" = "true" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release_meta.outputs.tag }}"
            echo "| **GitHub Release** | [🏷️ View Release ${{ steps.release_meta.outputs.tag }}](${RELEASE_URL}) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💻 Download via GitHub CLI (\`gh\`):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gh run download ${{ github.run_id }} -n SpendSense-Release-APK -D /mnt/c/Users/vuong/Downloads" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 Install to Device (ADB):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "/mnt/d/Apps/Android/Sdk/platform-tools/adb.exe install /mnt/c/Users/vuong/Downloads/SpendSense.apk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
