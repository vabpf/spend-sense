name: Test & Build Release APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What do you want to run?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'test'
          - 'build'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx12288m -XX:+UseG1GC -Dfile.encoding=UTF-8\" -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4"
  JAVA_OPTS: "-Xmx12288m"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'all' || inputs.target == 'test' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: false

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (inputs.target == 'all' || inputs.target == 'build') && (needs.test.result == 'success' || needs.test.result == 'skipped')

    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: false

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/SpendSense.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendSense-Release-APK
          path: artifacts/SpendSense.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SpendSense.apk
          name: SpendSense ${{ github.ref_name }}
          generate_release_notes: true
